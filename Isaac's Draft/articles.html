<!DOCTYPE html>
<html lang="en" data-type="editorial" data-accent="blue" data-hero="split">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>All News &middot; AI Ethics Initiative</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Public+Sans:wght@400;500;600;700;800&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/pages.css">
</head>
<body data-page="news">
<div id="site-header"></div>

<main data-screen-label="All articles page">
  <header class="phead">
    <div class="wrap">
      <nav class="crumbs"><a href="index.html">Home</a> <span>/</span> <a href="news.html">News</a> <span>/</span> <span>All articles</span></nav>
      <p class="kicker">(EXAMPLE TEXT) The feed</p>
      <h1>AI Ethics News</h1>
      <p>News feed tag-line</p>
    </div>
  </header>

  <section class="section" data-screen-label="Article browser">
    <div class="wrap">
      <div class="browse">
        <a class="back-link" href="news.html"><span class="arr">&larr;</span> Back to News</a>

        <div class="browse-bar">
          <label class="search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input type="search" id="search" placeholder="Search articles, sources, topics&hellip;" aria-label="Search articles" autocomplete="off">
          </label>
          <p class="browse-count" id="browse-count" style="padding:0;"></p>
        </div>

        <div class="filter-row">
          <div class="filter-chips topic-bar" id="filters" role="group" aria-label="Filter articles by topic">
            <button type="button" class="chip-all" data-topic="all" aria-pressed="true">All topics</button>
          </div>
          <button type="button" class="more-tags" id="more-tags" aria-expanded="false" hidden>
            <span class="more-tags__label">More tags</span>
            <svg class="more-tags__chev" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="feed-list" id="feed-list"></div>
        <p class="feed-empty" id="empty-note" hidden>No articles match. Try a different keyword or topic.</p>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="assets/news.js"></script>
<script src="assets/chrome.js"></script>
<script>
  var listEl = document.getElementById("feed-list");
  AIEINews.renderFeed(listEl);

  var rows = [].slice.call(listEl.querySelectorAll(".feed-row"));
  var searchEl = document.getElementById("search");
  var countEl = document.getElementById("browse-count");
  var emptyNote = document.getElementById("empty-note");
  var filtersEl = document.getElementById("filters");
  var allChip = filtersEl.querySelector('[data-topic="all"]');

  // Selected tags (OR logic). Empty set = show all.
  var selected = {};
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  // Build a chip for every tag in the taxonomy (after the “All topics” reset).
  AIEINews.TOPICS.forEach(function (t) {
    var b = document.createElement("button");
    b.type = "button";
    b.setAttribute("data-topic", t);
    b.setAttribute("aria-pressed", "false");
    b.innerHTML = esc(t);
    b.addEventListener("click", function () { toggleTag(t); });
    filtersEl.appendChild(b);
  });

  // Collapse the chips to a single row, with a “More tags” caret to reveal the
  // rest. We measure one row's height and cap the container when collapsed.
  var moreBtn = document.getElementById("more-tags");
  var moreLabel = moreBtn.querySelector(".more-tags__label");
  var collapsed = true;
  // Precise bottom of the first row of chips, relative to the container top.
  function firstRowHeight() {
    var ctop = filtersEl.getBoundingClientRect().top;
    var chips = [].slice.call(filtersEl.querySelectorAll("button"));
    if (!chips.length) return 0;
    var minTop = Math.min.apply(null, chips.map(function (c) { return c.getBoundingClientRect().top; }));
    var bottom = 0;
    chips.forEach(function (c) {
      var r = c.getBoundingClientRect();
      if (r.top - minTop < 2) bottom = Math.max(bottom, r.bottom);
    });
    return Math.ceil(bottom - ctop);
  }
  function applyCollapse() {
    if (collapsed) {
      filtersEl.style.maxHeight = firstRowHeight() + "px";
      filtersEl.style.overflow = "hidden";
    } else {
      filtersEl.style.maxHeight = "";
      filtersEl.style.overflow = "";
    }
  }
  function syncMoreBtn() {
    // Only offer the toggle when the chips actually span more than one row.
    var prevMax = filtersEl.style.maxHeight, prevOv = filtersEl.style.overflow;
    filtersEl.style.maxHeight = ""; filtersEl.style.overflow = "";
    var oneRow = firstRowHeight();
    var multiRow = filtersEl.scrollHeight > oneRow + 4;
    filtersEl.style.maxHeight = prevMax; filtersEl.style.overflow = prevOv;
    moreBtn.hidden = !multiRow;
    if (!multiRow) { collapsed = false; applyCollapse(); }
  }
  moreBtn.addEventListener("click", function () {
    collapsed = !collapsed;
    moreBtn.setAttribute("aria-expanded", String(!collapsed));
    moreLabel.textContent = collapsed ? "More tags" : "Fewer tags";
    applyCollapse();
  });
  window.addEventListener("resize", function () { applyCollapse(); syncMoreBtn(); });

  function reflectControls() {
    var n = Object.keys(selected).length;
    [].slice.call(filtersEl.querySelectorAll('button[data-topic]')).forEach(function (b) {
      var t = b.getAttribute("data-topic");
      if (t === "all") b.setAttribute("aria-pressed", String(n === 0));
      else b.setAttribute("aria-pressed", String(!!selected[t]));
    });
  }

  function toggleTag(t) { setTag(t, !selected[t]); }
  function setTag(t, on) {
    if (on) selected[t] = true; else delete selected[t];
    reflectControls();
    apply();
  }
  function clearTags() { selected = {}; reflectControls(); apply(); }

  function apply() {
    var q = searchEl.value.trim().toLowerCase();
    var tags = Object.keys(selected);
    var shown = 0;
    rows.forEach(function (row) {
      var rowTopics = row.getAttribute("data-topics").split("|");
      // OR logic: no tags selected = all; otherwise match ANY selected tag.
      var topicOk = tags.length === 0 || tags.some(function (t) { return rowTopics.indexOf(t) !== -1; });
      var searchOk = !q || row.getAttribute("data-search").indexOf(q) !== -1;
      var match = topicOk && searchOk;
      row.style.display = match ? "" : "none";
      if (match) shown++;
    });
    emptyNote.hidden = shown !== 0;
    countEl.innerHTML = "<strong>" + shown + "</strong> of " + rows.length + " article" + (rows.length === 1 ? "" : "s");
  }

  allChip.addEventListener("click", clearTags);
  searchEl.addEventListener("input", apply);

  reflectControls();
  syncMoreBtn();
  applyCollapse();
  apply();
</script>
</body>
</html>
