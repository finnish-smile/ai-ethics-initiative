<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive upload test</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #002e5d; }
  label { display: block; margin: 16px 0 4px; font-weight: 600; }
  input[type=text] { width: 100%; padding: 8px; box-sizing: border-box; }
  button { margin-top: 20px; padding: 10px 18px; font-size: 16px; }
  progress { width: 100%; height: 18px; }
  pre { background: #f3f5f8; padding: 12px; white-space: pre-wrap; font-size: 13px; }
</style>
</head>
<body>
<h1>Drive upload test</h1>
<p>Test only, not part of the site. Sends a document and a video to the club Drive through the Apps Script, then logs a test entry.</p>

<label for="url">Apps Script web app URL (ends in /exec)</label>
<input id="url" type="text" placeholder="https://script.google.com/macros/s/.../exec">

<label for="doc">Constitution file</label>
<input id="doc" type="file" accept=".pdf,.doc,.docx,.txt,.md">

<label for="video">Video (try a large one, ~200 MB)</label>
<input id="video" type="file" accept="video/mp4,video/quicktime,video/webm,video/x-m4v">

<button id="go">Upload test entry</button>

<label>Progress</label>
<progress id="bar" value="0" max="1"></progress>
<pre id="log"></pre>

<script>
const CHUNK = 8 * 1024 * 1024 // must be a multiple of 256 KB
const $ = (id) => document.getElementById(id)
const log = (msg) => { $('log').textContent += msg + '\n' }

try { $('url').value = localStorage.getItem('scriptUrl') || '' } catch {}

async function callScript(body) {
  // text/plain avoids a CORS preflight, which Apps Script can't answer.
  const res = await fetch($('url').value.trim(), { method: 'POST', body: JSON.stringify(body) })
  const data = await res.json()
  if (!data.ok) throw new Error(data.error)
  return data
}

function mimeOf(file) {
  if (file.type) return file.type
  const ext = file.name.split('.').pop().toLowerCase()
  return { md: 'text/markdown', m4v: 'video/x-m4v', mov: 'video/quicktime' }[ext] || ''
}

async function upload(file, kind, onProgress) {
  const { uploadUrl } = await callScript({
    action: 'start', kind, name: file.name, mimeType: mimeOf(file), size: file.size, origin: location.origin,
  })
  for (let start = 0; start < file.size; start += CHUNK) {
    const end = Math.min(start + CHUNK, file.size)
    const res = await fetch(uploadUrl, {
      method: 'PUT',
      headers: { 'Content-Range': `bytes ${start}-${end - 1}/${file.size}` },
      body: file.slice(start, end),
    })
    onProgress(end)
    if (end === file.size) {
      if (!res.ok) throw new Error('Final chunk failed: ' + res.status)
      return (await res.json()).id
    }
    if (res.status !== 308) throw new Error('Chunk failed: ' + res.status)
  }
}

$('go').onclick = async () => {
  const doc = $('doc').files[0], video = $('video').files[0]
  if (!$('url').value || !doc || !video) return log('Fill in the URL and pick both files.')
  try { localStorage.setItem('scriptUrl', $('url').value.trim()) } catch {}
  $('log').textContent = ''
  const total = doc.size + video.size
  const t0 = Date.now()
  try {
    log(`Uploading ${doc.name} (${(doc.size / 1e6).toFixed(1)} MB)…`)
    const docId = await upload(doc, 'doc', (n) => { $('bar').value = n / total })
    log(`Uploading ${video.name} (${(video.size / 1e6).toFixed(1)} MB)…`)
    const videoId = await upload(video, 'video', (n) => { $('bar').value = (doc.size + n) / total })
    log('Logging the entry and emailing the club…')
    await callScript({
      action: 'finish', docId, videoId,
      fields: { name: 'TEST ENTRY', email: 'test@byu.edu', major: 'Test', year: 'Senior' },
    })
    log(`Done in ${((Date.now() - t0) / 1000).toFixed(0)} s. Check the Drive folder, the Sheet and the club inbox.`)
  } catch (err) {
    log('FAILED: ' + err.message)
    if (err instanceof TypeError) log('A TypeError here usually means the browser blocked the request (CORS). Tell Claude.')
  }
}
</script>
</body>
</html>
